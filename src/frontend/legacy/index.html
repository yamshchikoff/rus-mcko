<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Тренажёр ВПР — Русский язык, 7 класс</title>
<link rel="stylesheet" href="sdamgia.css"/>
</head>
<body>

<header>
  <h1>Тренажёр ВПР по русскому языку</h1>
  <p>7 класс · 15 вариантов · формат 2026 года</p>
</header>

<div class="variant-selector">
  <label for="variant-select">Вариант:</label>
  <select id="variant-select">
    <option value="">— Выберите вариант —</option>
  </select>
  <button class="progress-toggle-btn" onclick="showProgress()">Прогресс</button>
</div>

<div id="timer-bar" class="timer-bar">
  <table class="timer-table">
    <tr>
      <td class="timer-label">Прошло&nbsp;</td>
      <td class="timer-value timer-elapsed" id="t-elapsed">0:00</td>
      <td class="timer-label">Осталось&nbsp;</td>
      <td class="timer-value timer-remaining" id="t-remaining">45:00</td>
      <td>
        <button class="timer-btn" id="t-pause" onclick="toggleTimer()">Пауза</button>
        <button class="timer-btn" onclick="resetTimer()">Заново</button>
        <button class="timer-btn timer-btn-finish" onclick="finishWork()">Завершить работу</button>
      </td>
    </tr>
  </table>
</div>

<main id="content">
  <div class="loading">Загрузка вариантов...</div>
</main>

<section id="progress-section" class="progress-section" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h2>Прогресс</h2>
    <button class="toggle-btn" onclick="exportProgress()" style="margin:0">Скачать</button>
    <button class="toggle-btn" onclick="hideProgress()" style="margin:0">Скрыть</button>
  </div>
  <div id="progress-table"></div>
</section>

<footer>
  Тренажёр ВПР · Русский язык 7 класс · Данные: rus7-vpr.sdamgia.ru
</footer>

<div id="reset-modal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <p class="modal-text">Начать всю работу сначала?</p>
    <div class="modal-buttons">
      <button class="modal-btn modal-btn-yes" onclick="doReset()">Да</button>
      <button class="modal-btn modal-btn-no" onclick="hideResetConfirm()">Нет</button>
    </div>
  </div>
</div>

<div id="switch-modal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <p class="modal-text">Сбросить прогресс по текущей работе и сменить вариант?</p>
    <div class="modal-buttons">
      <button class="modal-btn modal-btn-yes" onclick="doSwitch()">Да</button>
      <button class="modal-btn modal-btn-no" onclick="cancelSwitch()">Нет</button>
    </div>
  </div>
</div>

<script>
const DATA_URL = 'data/vpr/variants.json';

let variants = [];
let currentVariant = null;
let pendingVariant = null;

document.addEventListener('DOMContentLoaded', async () => {
  try {
    const resp = await fetch(DATA_URL);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    variants = data.variants;
    populateSelector();
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="error">Ошибка загрузки вариантов: ${e.message}<br>
       Убедитесь, что сервер запущен из корня проекта:<br>
       <code>python3 -m http.server 8080</code></div>`;
  }
});

function populateSelector() {
  const sel = document.getElementById('variant-select');
  variants.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.num;
    opt.textContent = `Вариант ${v.num}`;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => {
    if (sel.value) requestVariantSwitch(parseInt(sel.value));
  });
  document.getElementById('content').innerHTML =
    '<div class="loading">Выберите вариант, чтобы начать</div>';
}

function showVariant(num) {
  const v = variants.find(x => x.num === num);
  if (!v) return;

  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  currentVariant = num;
  startTimer();

  const t1 = v.tasks.find(t => t.issue === 1);
  const tasks14 = v.tasks.filter(t => t.issue >= 1 && t.issue <= 4);
  const tasks57 = v.tasks.filter(t => t.issue >= 5 && t.issue <= 7);

  let html = '';

  // Shared text block for tasks 1-4
  if (t1 && t1.text_html) {
    html += `<div class="text-block"><h3>Текст 1</h3>${balanceHtml(t1.text_html)}</div>`;
  }

  // Tasks 1-4 (share a common text)
  tasks14.forEach(t => {
    html += renderTask(t, num);
  });

  // Tasks 5-7
  tasks57.forEach(t => {
    html += renderTask(t, num);
  });

  document.getElementById('content').innerHTML = html;
  restoreAnswers(num);
}

function renderTask(t, vNum) {
  const cats = ['К1', 'К2', 'К3', 'К4', 'К5', 'К6', 'К7'];
  const cat = cats[t.issue - 1] || '';
  const id = `task-${t.issue}`;
  const taId = `ta-${vNum}-${t.issue}`;

  return `
    <div class="task">
      <div class="task-header">${cat}. ${escHtml(t.category)}</div>
      <div class="task-content">${balanceHtml(t.content_html)}</div>
      <textarea id="${taId}" class="task-answer" placeholder="Введите ваш ответ..."></textarea>
      <div style="margin-top:8px">
        <button class="save-btn" onclick="saveAnswer(${vNum},${t.issue})">Ответить</button>
        <button class="toggle-btn" onclick="toggleById('${id}-sol')">Показать пояснение</button>
        <button class="toggle-btn" onclick="toggleById('${id}-crit')">Показать критерии</button>
      </div>
      <div id="${id}-sol" class="solution" style="display:none">${balanceHtml(t.solution_html)}</div>
      <div id="${id}-crit" class="criteria" style="display:none">${balanceHtml(t.criteria_html)}</div>
    </div>`;
}

function toggleById(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const btn = event.target;
  if (el.style.display === 'none') {
    el.style.display = 'block';
    btn.textContent = btn.textContent.replace('Показать', 'Спрятать');
  } else {
    el.style.display = 'none';
    btn.textContent = btn.textContent.replace('Спрятать', 'Показать');
  }
}

function balanceHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.innerHTML;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Answer persistence
function saveAnswer(vNum, issue) {
  const ta = document.getElementById(`ta-${vNum}-${issue}`);
  if (!ta) return;
  const key = `vpr-ans-${vNum}-${issue}`;
  localStorage.setItem(key, ta.value);
  const btn = ta.parentElement.querySelector('.save-btn');
  if (btn) {
    btn.textContent = 'Сохранено ✓';
    btn.classList.add('saved');
    setTimeout(() => {
      btn.textContent = 'Ответить';
      btn.classList.remove('saved');
    }, 1500);
  }
}

function loadAnswer(vNum, issue) {
  return localStorage.getItem(`vpr-ans-${vNum}-${issue}`) || '';
}

function restoreAnswers(vNum) {
  for (let issue = 1; issue <= 7; issue++) {
    const ta = document.getElementById(`ta-${vNum}-${issue}`);
    if (ta) {
      ta.value = loadAnswer(vNum, issue);
    }
  }
}

// Variant switching with confirmation
function requestVariantSwitch(num) {
  if (num === currentVariant) return;
  if (!currentVariant) {
    showVariant(num);
    return;
  }
  pendingVariant = num;
  document.getElementById('switch-modal').style.display = 'flex';
}

function doSwitch() {
  document.getElementById('switch-modal').style.display = 'none';
  if (currentVariant) {
    for (let issue = 1; issue <= 7; issue++) {
      localStorage.removeItem(`vpr-ans-${currentVariant}-${issue}`);
    }
  }
  showVariant(pendingVariant);
  pendingVariant = null;
}

function cancelSwitch() {
  document.getElementById('switch-modal').style.display = 'none';
  const sel = document.getElementById('variant-select');
  sel.value = currentVariant || '';
  pendingVariant = null;
}

// Progress tracking

function loadProgress() {
  try { return JSON.parse(localStorage.getItem('vpr-progress')) || {}; }
  catch { return {}; }
}

function saveProgress(prog) {
  localStorage.setItem('vpr-progress', JSON.stringify(prog));
}

// Parse балл values from criteria HTML. Returns {min, next}:
// min — lowest балл (for empty answer), next — балл above min (for non-empty).
function parseScores(criteriaHtml) {
  const div = document.createElement('div');
  div.innerHTML = criteriaHtml;
  const scores = new Set();
  const tables = div.querySelectorAll('table');
  for (const table of tables) {
    for (const row of table.rows) {
      if (row.cells.length === 0) continue;
      const text = row.cells[row.cells.length - 1].textContent.trim();
      const num = parseInt(text, 10);
      if (!isNaN(num) && num >= 0) scores.add(num);
    }
  }
  const sorted = Array.from(scores).sort((a, b) => a - b);
  const min = sorted[0] || 0;
  const next = sorted.length > 1 ? sorted[1] : min + 1;
  return { min, next };
}

// Stub scoring: empty answer → min балл, non-empty → next балл.
function scoreTask(vNum, issue) {
  const ta = document.getElementById(`ta-${vNum}-${issue}`);
  const answer = ta ? ta.value.trim() : '';
  const v = variants.find(x => x.num === vNum);
  if (!v) return answer ? 1 : 0;
  const task = v.tasks.find(t => t.issue === issue);
  if (!task || !task.criteria_html) return answer ? 1 : 0;
  const { min, next } = parseScores(task.criteria_html);
  return answer ? next : min;
}

function markVariantCompleted(vNum) {
  const prog = loadProgress();
  const scores = {};
  for (let issue = 1; issue <= 7; issue++) {
    scores[issue] = scoreTask(vNum, issue);
  }
  prog[vNum] = {
    completed: new Date().toISOString(),
    scores: scores
  };
  saveProgress(prog);
}

function finishWork() {
  if (!currentVariant) return;
  if (!confirm('Завершить работу и посмотреть результаты?')) return;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  timerRunning = false;
  markVariantCompleted(currentVariant);
  renderProgressTable();
  document.getElementById('progress-section').style.display = 'block';
}

function showProgress() {
  renderProgressTable();
  document.getElementById('progress-section').style.display = 'block';
}

function hideProgress() {
  document.getElementById('progress-section').style.display = 'none';
}

function getTopics() {
  if (variants.length === 0) return [];
  const v = variants[0];
  const topics = [];
  for (const t of v.tasks) {
    topics.push({ issue: t.issue, category: t.category });
  }
  return topics;
}

function fmtDateTime(iso) {
  const d = new Date(iso);
  const pad = n => n < 10 ? '0' + n : n;
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderProgressTable() {
  const topics = getTopics();
  if (topics.length === 0) return;
  const prog = loadProgress();

  let th = '<tr><th>Вариант</th>';
  topics.forEach(t => { th += `<th>${escHtml(t.category)}</th>`; });
  th += '<th class="pt-finish-col">Завершён</th></tr>';

  let tb = '';
  for (let vNum = 1; vNum <= 15; vNum++) {
    const p = prog[vNum];
    tb += `<tr><td class="pt-vnum">${vNum}</td>`;
    topics.forEach(t => {
      const s = (p && p.scores && p.scores[t.issue] !== undefined) ? p.scores[t.issue] : null;
      tb += (s !== null) ? `<td class="pt-score">${s}</td>` : '<td class="pt-empty">—</td>';
    });
    if (p) {
      tb += `<td class="pt-finish-col">${fmtDateTime(p.completed)}</td>`;
    } else {
      tb += '<td class="pt-finish-col">—</td>';
    }
    tb += '</tr>';
  }

  document.getElementById('progress-table').innerHTML =
    `<table class="progress-table"><thead>${th}</thead><tbody>${tb}</tbody></table>`;
}

function exportProgress() {
  const progress = loadProgress();
  const nV = variants.length || 15;
  const nT = (variants.length > 0 && variants[0].tasks) ? variants[0].tasks.length : 7;
  const answers = {};
  for (let v = 1; v <= nV; v++) {
    for (let i = 1; i <= nT; i++) {
      const key = `vpr-ans-${v}-${i}`;
      const val = localStorage.getItem(key);
      if (val) answers[`${v}-${i}`] = val;
    }
  }
  const blob = new Blob(
    [JSON.stringify({ progress, answers, exported: new Date().toISOString() }, null, 2)],
    { type: 'application/json' }
  );
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'vpr-progress.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

// Timer
const TOTAL_SEC = 45 * 60;
let timerElapsed = 0;
let timerInterval = null;
let timerRunning = false;

function startTimer() {
  if (timerInterval) return;
  timerElapsed = 0;
  timerRunning = true;
  document.getElementById('timer-bar').classList.add('active');
  document.getElementById('t-pause').textContent = 'Пауза';
  updateTimerDisplay();
  timerInterval = setInterval(tick, 1000);
}

function tick() {
  timerElapsed++;
  updateTimerDisplay();
  if (timerElapsed >= TOTAL_SEC) {
    clearInterval(timerInterval);
    timerInterval = null;
    timerRunning = false;
    if (currentVariant) markVariantCompleted(currentVariant);
    renderProgressTable();
    document.getElementById('progress-section').style.display = 'block';
    alert('Время вышло. Работа завершена.');
  }
}

function toggleTimer() {
  if (!timerInterval && timerElapsed >= TOTAL_SEC) return;
  if (timerRunning) {
    clearInterval(timerInterval);
    timerInterval = null;
    timerRunning = false;
    document.getElementById('t-pause').textContent = 'Продолжить';
  } else {
    timerRunning = true;
    document.getElementById('t-pause').textContent = 'Пауза';
    timerInterval = setInterval(tick, 1000);
  }
}

function resetTimer() {
  document.getElementById('reset-modal').style.display = 'flex';
}

function doReset() {
  document.getElementById('reset-modal').style.display = 'none';
  if (currentVariant) {
    for (let issue = 1; issue <= 7; issue++) {
      localStorage.removeItem(`vpr-ans-${currentVariant}-${issue}`);
      const ta = document.getElementById(`ta-${currentVariant}-${issue}`);
      if (ta) ta.value = '';
    }
  }
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  timerElapsed = 0;
  timerRunning = true;
  document.getElementById('timer-bar').classList.add('active');
  document.getElementById('t-pause').textContent = 'Пауза';
  updateTimerDisplay();
  timerInterval = setInterval(tick, 1000);
}

function hideResetConfirm() {
  document.getElementById('reset-modal').style.display = 'none';
}

function updateTimerDisplay() {
  var rem = TOTAL_SEC - timerElapsed;
  document.getElementById('t-elapsed').textContent = fmtTime(timerElapsed);
  var remEl = document.getElementById('t-remaining');
  remEl.textContent = fmtTime(rem);
  if (rem <= 300) {
    remEl.classList.add('warning');
  } else {
    remEl.classList.remove('warning');
  }
}

function fmtTime(totalSec) {
  if (totalSec < 0) return '0:00';
  var m = Math.floor(totalSec / 60);
  var s = totalSec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}
</script>

</body>
</html>
